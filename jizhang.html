<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>简易记账</title>
<style>
:root{
  --bg:#0f0f1a;--card:#1a1a2e;--line:#2a2a40;--purple:#6c5ce7;--text:#f0f0f5;
  --muted:#8b8b9a;--red:#ff6b6b;--green:#51cf66;--orange:#ffa94d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:14px;min-height:100vh;padding-bottom:80px}
.wrap{max-width:480px;margin:0 auto}
.header{margin-bottom:14px}
.title{font-size:22px;font-weight:900}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.s-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.s-label{font-size:11px;color:var(--muted)}
.s-num{font-size:18px;font-weight:900;margin-top:4px}
.s-num.red{color:var(--red)}.s-num.green{color:var(--green)}.s-num.purple{color:var(--purple)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:700}
.tab.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.tab.exp.on{background:var(--red);border-color:var(--red)}
.tab.inc.on{background:var(--green);border-color:var(--green);color:#0f0f1a}
.amount-box{text-align:center;padding:16px 0}
.amount-box input{width:100%;border:none;background:transparent;color:var(--text);font-size:40px;font-weight:900;text-align:center;outline:none}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cat{padding:8px 14px;border-radius:20px;border:1px solid var(--line);font-size:13px;background:var(--bg);color:var(--muted)}
.cat.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.cat.exp.on{background:var(--red);border-color:var(--red)}
.cat.inc.on{background:var(--green);border-color:var(--green);color:#0f0f1a}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:12px;font-size:15px;outline:none;margin-top:6px}
input:focus,textarea:focus{border-color:var(--purple)}
label{font-size:12px;color:var(--muted)}
.btn{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:16px;font-weight:800;margin-top:12px}
.btn.exp{background:linear-gradient(135deg,#ff6b6b,#ee5a5a)}
.btn.inc{background:linear-gradient(135deg,#51cf66,#37b24d);color:#0f0f1a}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--text);height:40px;font-size:13px;width:auto;padding:0 14px;margin:0}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .left{flex:1;min-width:0}
.item .cat-name{font-weight:700;font-size:15px}
.item .note{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .right{text-align:right;margin-left:10px}
.item .money{font-weight:900;font-size:16px}
.item .time{font-size:11px;color:var(--muted);margin-top:2px}
.item .del{color:var(--red);font-size:12px;padding:4px 8px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-size:12px;padding:6px 0}
.nav button.on{color:var(--purple);font-weight:700}
.hidden{display:none!important}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.filter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--bg)}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.bar-wrap{height:8px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}
.bar{height:100%;background:var(--purple);border-radius:4px}
.bar.exp{background:var(--red)}.bar.inc{background:var(--green)}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-nav button{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 首页：记账 -->
  <div id="page-home">
    <div class="header">
      <div class="title">💰 简易记账</div>
      <div class="sub">本地存储 · 数据只在你手机上</div>
    </div>
    <div class="summary">
      <div class="s-card"><div class="s-label">本月支出</div><div class="s-num red" id="sumExp">0.00</div></div>
      <div class="s-card"><div class="s-label">本月收入</div><div class="s-num green" id="sumInc">0.00</div></div>
      <div class="s-card"><div class="s-label">结余</div><div class="s-num purple" id="sumBal">0.00</div></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="tab exp on" type="button" id="typeExp">支出</button>
        <button class="tab inc" type="button" id="typeInc">收入</button>
      </div>
      <div class="amount-box">
        <input type="number" id="amount" placeholder="0.00" inputmode="decimal" step="0.01">
      </div>
      <label>分类</label>
      <div class="cats" id="cats"></div>
      <label>备注（可选）</label>
      <input type="text" id="note" placeholder="写点什么…">
      <label>日期</label>
      <input type="date" id="dateInput">
      <button class="btn exp" type="button" id="saveBtn">记一笔</button>
    </div>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;font-size:14px">最近记录</span>
        <button class="btn sec" type="button" id="goList">全部明细</button>
      </div>
      <div id="recent"></div>
    </div>
  </div>

  <!-- 明细 -->
  <div id="page-list" class="hidden">
    <div class="header">
      <div class="title">明细</div>
      <div class="sub">点记录可删除</div>
    </div>
    <div class="panel">
      <div class="filter">
        <span class="chip on" data-f="all">全部</span>
        <span class="chip" data-f="expense">支出</span>
        <span class="chip" data-f="income">收入</span>
      </div>
      <div id="list"></div>
    </div>
    <div class="panel">
      <button class="btn sec" type="button" id="exportBtn" style="width:100%">导出 CSV</button>
      <button class="btn sec" type="button" id="clearAllBtn" style="width:100%;margin-top:8px;color:var(--red)">清空全部数据</button>
    </div>
  </div>

  <!-- 统计 -->
  <div id="page-stats" class="hidden">
    <div class="header">
      <div class="title">统计</div>
    </div>
    <div class="panel">
      <div class="month-nav">
        <button type="button" id="prevM">上一月</button>
        <span id="monthLabel" style="font-weight:800"></span>
        <button type="button" id="nextM">下一月</button>
      </div>
      <div class="summary" style="margin-bottom:0">
        <div class="s-card"><div class="s-label">支出</div><div class="s-num red" id="mExp">0</div></div>
        <div class="s-card"><div class="s-label">收入</div><div class="s-num green" id="mInc">0</div></div>
        <div class="s-card"><div class="s-label">结余</div><div class="s-num purple" id="mBal">0</div></div>
      </div>
    </div>
    <div class="panel">
      <div style="font-weight:700;margin-bottom:10px;font-size:14px">支出分类</div>
      <div id="expStats"></div>
    </div>
    <div class="panel">
      <div style="font-weight:700;margin-bottom:10px;font-size:14px">收入分类</div>
      <div id="incStats"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button type="button" class="on" id="nav0">记账</button>
  <button type="button" id="nav1">明细</button>
  <button type="button" id="nav2">统计</button>
</div>
<div class="toast" id="toast"></div>

<script>
var EXP_CATS = ['租金','维修','电池','餐饮','交通','购物','居住'];
var INC_CATS = ['工资','奖金','红包','理财','兼职','其他'];
var type = 'expense';
var cat = '租金';
var filter = 'all';
var viewMonth = new Date();

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},1500);
}

function getRecords(){
  try{return JSON.parse(localStorage.getItem('jz_records')||'[]');}catch(e){return [];}
}
function saveRecords(list){
  localStorage.setItem('jz_records', JSON.stringify(list));
}

function money(n){return (Number(n)||0).toFixed(2);}

function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function monthKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function showPage(i){
  document.getElementById('page-home').classList.toggle('hidden', i!==0);
  document.getElementById('page-list').classList.toggle('hidden', i!==1);
  document.getElementById('page-stats').classList.toggle('hidden', i!==2);
  document.getElementById('nav0').classList.toggle('on', i===0);
  document.getElementById('nav1').classList.toggle('on', i===1);
  document.getElementById('nav2').classList.toggle('on', i===2);
  if(i===0) renderHome();
  if(i===1) renderList();
  if(i===2) renderStats();
}

function renderCats(){
  var list = type==='expense' ? EXP_CATS : INC_CATS;
  if(list.indexOf(cat)<0) cat=list[0];
  var html='';
  for(var i=0;i<list.length;i++){
    var c=list[i];
    html+='<span class="cat '+(type==='expense'?'exp':'inc')+(cat===c?' on':'')+'" data-c="'+c+'">'+c+'</span>';
  }
  document.getElementById('cats').innerHTML=html;
}

function renderHome(){
  var list=getRecords();
  var mk=monthKey(new Date());
  var exp=0,inc=0;
  for(var i=0;i<list.length;i++){
    var r=list[i];
    if((r.date||'').slice(0,7)!==mk) continue;
    if(r.type==='expense') exp+=Number(r.amount);
    else inc+=Number(r.amount);
  }
  document.getElementById('sumExp').textContent=money(exp);
  document.getElementById('sumInc').textContent=money(inc);
  document.getElementById('sumBal').textContent=money(inc-exp);
  var recent=list.slice(0,8);
  var el=document.getElementById('recent');
  if(!recent.length){el.innerHTML='<div class="empty">还没有记录，记一笔吧</div>';return;}
  el.innerHTML=recent.map(function(r){
    return '<div class="item"><div class="left"><div class="cat-name">'+r.category+'</div><div class="note">'+(r.note||r.date)+'</div></div><div class="right"><div class="money '+(r.type==='expense'?'red':'green')+'">'+(r.type==='expense'?'-':'+')+money(r.amount)+'</div><div class="time">'+r.date+'</div></div></div>';
  }).join('');
}

function renderList(){
  var list=getRecords();
  if(filter==='expense') list=list.filter(function(r){return r.type==='expense';});
  if(filter==='income') list=list.filter(function(r){return r.type==='income';});
  var el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty">暂无记录</div>';return;}
  el.innerHTML=list.map(function(r){
    return '<div class="item"><div class="left"><div class="cat-name">'+r.category+'</div><div class="note">'+(r.note||'')+' · '+r.date+'</div></div><div class="right"><div class="money '+(r.type==='expense'?'red':'green')+'">'+(r.type==='expense'?'-':'+')+money(r.amount)+'</div><div class="del" data-id="'+r.id+'">删除</div></div></div>';
  }).join('');
}

function renderStats(){
  var mk=monthKey(viewMonth);
  document.getElementById('monthLabel').textContent=mk;
  var list=getRecords().filter(function(r){return (r.date||'').slice(0,7)===mk;});
  var exp=0,inc=0;
  var expMap={},incMap={};
  for(var i=0;i<list.length;i++){
    var r=list[i];
    var a=Number(r.amount)||0;
    if(r.type==='expense'){exp+=a;expMap[r.category]=(expMap[r.category]||0)+a;}
    else{inc+=a;incMap[r.category]=(incMap[r.category]||0)+a;}
  }
  document.getElementById('mExp').textContent=money(exp);
  document.getElementById('mInc').textContent=money(inc);
  document.getElementById('mBal').textContent=money(inc-exp);
  document.getElementById('expStats').innerHTML=buildStatBars(expMap,exp,'exp');
  document.getElementById('incStats').innerHTML=buildStatBars(incMap,inc,'inc');
}

function buildStatBars(map,total,cls){
  var keys=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
  if(!keys.length) return '<div class="empty">本月暂无</div>';
  return keys.map(function(k){
    var pct=total? (map[k]/total*100) : 0;
    return '<div class="stat-row"><div style="flex:1"><div style="display:flex;justify-content:space-between"><span>'+k+'</span><span>'+money(map[k])+'</span></div><div class="bar-wrap"><div class="bar '+cls+'" style="width:'+pct+'%"></div></div></div></div>';
  }).join('');
}

function save(){
  var amount=Number(document.getElementById('amount').value);
  if(!amount||amount<=0){toast('请输入金额');return;}
  var note=document.getElementById('note').value.trim();
  var date=document.getElementById('dateInput').value||todayStr();
  var list=getRecords();
  list.unshift({
    id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type: type,
    amount: amount,
    category: cat,
    note: note,
    date: date,
    ts: Date.now()
  });
  saveRecords(list);
  document.getElementById('amount').value='';
  document.getElementById('note').value='';
  toast('已记账');
  renderHome();
}

// events
document.getElementById('typeExp').onclick=function(){
  type='expense';cat='租金';
  this.classList.add('on');document.getElementById('typeInc').classList.remove('on');
  document.getElementById('saveBtn').className='btn exp';
  renderCats();
};
document.getElementById('typeInc').onclick=function(){
  type='income';cat='工资';
  this.classList.add('on');document.getElementById('typeExp').classList.remove('on');
  document.getElementById('saveBtn').className='btn inc';
  renderCats();
};
document.getElementById('cats').addEventListener('click',function(e){
  var c=e.target.closest('[data-c]');if(!c)return;
  cat=c.dataset.c;renderCats();
});
document.getElementById('saveBtn').onclick=save;
document.getElementById('goList').onclick=function(){showPage(1);};
document.getElementById('nav0').onclick=function(){showPage(0);};
document.getElementById('nav1').onclick=function(){showPage(1);};
document.getElementById('nav2').onclick=function(){showPage(2);};

document.getElementById('list').addEventListener('click',function(e){
  var d=e.target.closest('[data-id]');if(!d)return;
  if(!confirm('删除这条记录？'))return;
  var id=d.dataset.id;
  var list=getRecords().filter(function(r){return r.id!==id;});
  saveRecords(list);
  renderList();renderHome();
  toast('已删除');
});

document.querySelector('.filter').addEventListener('click',function(e){
  var c=e.target.closest('[data-f]');if(!c)return;
  filter=c.dataset.f;
  var chips=document.querySelectorAll('.filter .chip');
  for(var i=0;i<chips.length;i++) chips[i].classList.toggle('on', chips[i].dataset.f===filter);
  renderList();
});

document.getElementById('exportBtn').onclick=function(){
  var list=getRecords();
  if(!list.length){toast('没有数据');return;}
  var csv='日期,类型,分类,金额,备注\n';
  for(var i=0;i<list.length;i++){
    var r=list[i];
    csv+=r.date+','+(r.type==='expense'?'支出':'收入')+','+r.category+','+r.amount+','+(r.note||'')+'\n';
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='记账_'+todayStr()+'.csv';
  a.click();
  toast('已导出');
};

document.getElementById('clearAllBtn').onclick=function(){
  if(!confirm('确定清空全部记账数据？不可恢复'))return;
  saveRecords([]);
  renderList();renderHome();
  toast('已清空');
};

document.getElementById('prevM').onclick=function(){
  viewMonth=new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
  renderStats();
};
document.getElementById('nextM').onclick=function(){
  viewMonth=new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
  renderStats();
};

document.getElementById('dateInput').value=todayStr();
renderCats();
renderHome();
</script>
</body>
</html>
